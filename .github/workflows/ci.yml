name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Syntax
        run: bash -n bin/starintel-admin tests/admin-cli.sh
      - name: Shellcheck
        run: shellcheck --severity=warning bin/starintel-admin tests/admin-cli.sh
      - name: Tests
        run: bash tests/admin-cli.sh
      - uses: cachix/install-nix-action@v31
      - name: Nix eval
        run: nix flake check --no-build
